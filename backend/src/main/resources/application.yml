server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: bajrix-marketplace

  # Default profile uses H2 for instant zero-dependency test execution
  datasource:
    url: jdbc:h2:mem:bajrixdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.bajrix.marketplace: INFO
    org.hibernate.SQL: WARN
